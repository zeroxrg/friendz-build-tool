name: rust

on:
  repository_dispatch:
    types: [rust]
  workflow_call:
    inputs:
      gist_id:
        description: 'ID of the secret gist holding src.tar.gz.b64'
        required: true
        type: string
      project:
        description: 'Project name, used for artifact naming'
        required: false
        type: string
        default: 'crate'
      profile:
        description: 'dev or release'
        required: false
        type: string
        default: 'release'
      target:
        description: 'Rust target triple. Empty means host default.'
        required: false
        type: string
        default: ''
      features:
        description: 'Comma-separated cargo features'
        required: false
        type: string
        default: ''
      all_features:
        description: 'Pass --all-features'
        required: false
        type: string
        default: 'false'
      no_default_features:
        description: 'Pass --no-default-features'
        required: false
        type: string
        default: 'false'
      run_tests:
        description: 'Run cargo test before building'
        required: false
        type: string
        default: 'false'
      raw:
        description: 'true uploads the bare binary, false uploads a tarball'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.client_payload.gist_id || inputs.gist_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve inputs
        id: params
        env:
          EV_GIST: ${{ github.event.client_payload.gist_id }}
          EV_PROJECT: ${{ github.event.client_payload.project }}
          EV_PROFILE: ${{ github.event.client_payload.profile }}
          EV_TARGET: ${{ github.event.client_payload.target }}
          EV_FEATURES: ${{ github.event.client_payload.features }}
          EV_ALL: ${{ github.event.client_payload.all_features }}
          EV_NODEF: ${{ github.event.client_payload.no_default_features }}
          EV_TESTS: ${{ github.event.client_payload.run_tests }}
          EV_RAW: ${{ github.event.client_payload.raw }}
          IN_GIST: ${{ inputs.gist_id }}
          IN_PROJECT: ${{ inputs.project }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_TARGET: ${{ inputs.target }}
          IN_FEATURES: ${{ inputs.features }}
          IN_ALL: ${{ inputs.all_features }}
          IN_NODEF: ${{ inputs.no_default_features }}
          IN_TESTS: ${{ inputs.run_tests }}
          IN_RAW: ${{ inputs.raw }}
        run: |
          set -euo pipefail
          pick() {
            if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi
          }
          {
            echo "gist=$(pick "$EV_GIST" "$IN_GIST")"
            echo "project=$(pick "$EV_PROJECT" "$IN_PROJECT")"
            echo "profile=$(pick "$EV_PROFILE" "$IN_PROFILE")"
            echo "target=$(pick "$EV_TARGET" "$IN_TARGET")"
            echo "features=$(pick "$EV_FEATURES" "$IN_FEATURES")"
            echo "all=$(pick "$EV_ALL" "$IN_ALL")"
            echo "nodef=$(pick "$EV_NODEF" "$IN_NODEF")"
            echo "tests=$(pick "$EV_TESTS" "$IN_TESTS")"
            echo "raw=$(pick "$EV_RAW" "$IN_RAW")"
          } >> "$GITHUB_OUTPUT"
          echo "project=${{ steps.params.outputs.project }} profile=${{ steps.params.outputs.profile }} target=${{ steps.params.outputs.target }}"

      - name: Validate inputs
        env:
          PROFILE: ${{ steps.params.outputs.profile }}
          TARGET: ${{ steps.params.outputs.target }}
          FEATURES: ${{ steps.params.outputs.features }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            release|dev) ;;
            *) echo "::error::profile must be release or dev, got '$PROFILE'"; exit 1 ;;
          esac
          # Target triple is allowlisted to the shape rustc emits, so a
          # crafted dispatch cannot inject shell metacharacters.
          if [ -n "$TARGET" ] && ! printf '%s' "$TARGET" | grep -Eq '^[a-z0-9_]+(-[a-z0-9_]+)*$'; then
            echo "::error::invalid target triple: '$TARGET'"; exit 1
          fi
          if [ -n "$FEATURES" ] && ! printf '%s' "$FEATURES" | grep -Eq '^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$'; then
            echo "::error::invalid features list: '$FEATURES'"; exit 1
          fi
          echo "inputs ok"

      - name: Fetch source from secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          set -euo pipefail
          if [ -z "$GIST_TOKEN" ]; then
            echo "::error::GIST_TOKEN secret is not set on this repository."
            exit 1
          fi
          if [ -z "$GIST_ID" ]; then
            echo "::error::No gist id supplied."
            exit 1
          fi
          # gh reads auth from GH_TOKEN, so export it rather than passing a header.
          url=$(GH_TOKEN="$GIST_TOKEN" gh api "gists/$GIST_ID" \
            --jq '.files["src.tar.gz.b64"].raw_url // .files["src.tar.gz"].raw_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Gist $GIST_ID has no src.tar.gz.b64 file."
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GIST_TOKEN" "$url" -o src.b64
          base64 -d src.b64 > src.tar.gz
          rm -f src.b64
          ls -l src.tar.gz

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p src
          tar xzf src.tar.gz -C src
          rm -f src.tar.gz
          ls -A src

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build dir
        uses: actions/cache@v4
        with:
          path: |
            src/.cargo/registry
            src/.cargo/git
            src/target
          key: cargo-${{ steps.params.outputs.project }}-${{ steps.params.outputs.profile }}-${{ hashFiles('src/Cargo.toml') }}
          restore-keys: |
            cargo-${{ steps.params.outputs.project }}-${{ steps.params.outputs.profile }}-
            cargo-${{ steps.params.outputs.project }}-

      - name: Locate crate root
        id: crate
        working-directory: src
        run: |
          set -euo pipefail
          # fbt may be pointed at a subdirectory of a repo, so honour a
          # Cargo.toml at the root first, then look one level down.
          if [ -f Cargo.toml ]; then
            root="."
          else
            root="$(find . -maxdepth 2 -name Cargo.toml -type f -printf '%h\n' | head -1)"
          fi
          if [ -z "$root" ]; then
            echo "::error::No Cargo.toml found in the uploaded source."
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "crate root: $root"

      - name: Run tests
        if: steps.params.outputs.tests == 'true'
        working-directory: src
        env:
          FEATURES: ${{ steps.params.outputs.features }}
          ALL: ${{ steps.params.outputs.all }}
          NODEF: ${{ steps.params.outputs.nodef }}
        run: |
          set -euo pipefail
          args=(--all-targets)
          [ -n "$FEATURES" ] && args+=(--features "$FEATURES")
          [ "$ALL" = "true" ] && args+=(--all-features)
          [ "$NODEF" = "true" ] && args+=(--no-default-features)
          cargo test "${args[@]}"

      # id matters: the collect step reads triple and subdir from here, and
      # without it they resolve empty, which collapses every candidate path to
      # target/ and breaks any build that used --target.
      - name: Build
        id: build
        working-directory: src
        env:
          ROOT: ${{ steps.crate.outputs.root }}
          PROFILE: ${{ steps.params.outputs.profile }}
          TARGET: ${{ steps.params.outputs.target }}
          FEATURES: ${{ steps.params.outputs.features }}
          ALL: ${{ steps.params.outputs.all }}
          NODEF: ${{ steps.params.outputs.nodef }}
        run: |
          set -euo pipefail
          cd "$ROOT"

          args=()
          [ "$PROFILE" = "release" ] && args+=(--release)
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          [ -n "$FEATURES" ] && args+=(--features "$FEATURES")
          [ "$ALL" = "true" ] && args+=(--all-features)
          [ "$NODEF" = "true" ] && args+=(--no-default-features)

          echo "cargo build ${args[*]:-}"
          cargo build "${args[@]}"

          # Record where artifacts land. A crate can put output in the
          # triple-qualified directory or in target/ directly depending on
          # whether --target was passed, so record both and let the collect
          # step search rather than guessing.
          host=$(rustc -vV | sed -n 's/^host: //p')
          triple="${TARGET:-$host}"
          subdir="$([ "$PROFILE" = release ] && echo release || echo debug)"
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          echo "subdir=$subdir" >> "$GITHUB_OUTPUT"
          echo "built; looking for artifacts under target/"

      - name: Collect artifacts
        id: pack
        working-directory: src
        env:
          ROOT: ${{ steps.crate.outputs.root }}
          TRIPLE: ${{ steps.build.outputs.triple }}
          SUBDIR: ${{ steps.build.outputs.subdir }}
          RAW: ${{ steps.params.outputs.raw }}
          PROJECT: ${{ steps.params.outputs.project }}
        run: |
          set -euo pipefail
          cd "$ROOT"
          mkdir -p dist

          # Cargo writes to target/<triple>/<profile> when --target is used and
          # to target/<profile> when it is not. Search both.
          dirs=("target/${TRIPLE}/${SUBDIR}" "target/${SUBDIR}" "target/${TRIPLE}" "target")
          found=0
          for d in "${dirs[@]}"; do
            [ -d "$d" ] && { found=1; break; }
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No target directory found after a successful build."
            exit 1
          fi
          echo "artifacts under: $d"

          shopt -s nullglob
          candidates=("target/${TRIPLE}/${SUBDIR}" "target/${SUBDIR}" "target/${TRIPLE}" "target")

          # Every artifact type cargo can emit for a first-party crate:
          # executables, native libs from cdylib/staticlib crate-types, and
          # rlib/rmeta from a plain library. Search order is bin, native, lib
          # because a crate with [[bin]] wants the binary first.
          kind=""
          found=()

          for cand in "${candidates[@]}"; do
            [ -d "$cand" ] || continue
            while IFS= read -r -d '' f; do found+=("$f"); done \
              < <(find "$cand" -maxdepth 1 -type f -executable ! -name '*.d' -print0)
            [ ${#found[@]} -gt 0 ] && { kind="bin"; break; }
          done

          if [ ${#found[@]} -eq 0 ]; then
            kind="native"
            for cand in "${candidates[@]}"; do
              [ -d "$cand" ] || continue
              while IFS= read -r -d '' f; do found+=("$f"); done \
                < <(find "$cand" -maxdepth 1 -type f \
                      \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.a' \) \
                      ! -name '*.d' -print0)
              [ ${#found[@]} -gt 0 ] && break
            done
          fi

          if [ ${#found[@]} -eq 0 ]; then
            kind="lib"
            for cand in "${candidates[@]}"; do
              [ -d "$cand" ] || continue
              while IFS= read -r -d '' f; do found+=("$f"); done \
                < <(find "$cand" -maxdepth 1 -type f -name '*.rlib' -print0)
              [ ${#found[@]} -gt 0 ] && break
            done
          fi

          # Narrow to the crate's own artifacts. Dependency artifacts live in
          # deps/, but a cdylib or staticlib build can still copy some to the
          # top level, so match on the crate name from Cargo.toml.
          crate_name="$(sed -n 's/^name[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$crate_name" ] && [ "$kind" != "bin" ]; then
            filtered=()
            for b in "${found[@]}"; do
              if [[ "$(basename "$b")" == *"$crate_name"* ]]; then
                filtered+=("$b")
              fi
            done
            [ ${#filtered[@]} -gt 0 ] && found=("${filtered[@]}")
          fi

          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::Build produced no recognisable artifacts."
            find target -maxdepth 3 -type f | head -30 || true
            exit 1
          fi
          printf 'Found %d %s artifact(s)\n' "${#found[@]}" "$kind"

          names=""
          for b in "${found[@]}"; do
            base="$(basename "$b")"
            if [ "$RAW" = "true" ] || [ "$kind" = "lib" ] || [ "$kind" = "native" ]; then
              # Raw mode, plus libraries whose filename already carries the
              # correct extension, go in dist/ as-is.
              cp "$b" "dist/$base"
            else
              mkdir -p dist/pkg
              cp "$b" "dist/pkg/$base"
            fi
            names="$names $base"
          done

          if [ "$RAW" = "true" ] || [ "$kind" = "lib" ] || [ "$kind" = "native" ]; then
            echo "mode=$kind" >> "$GITHUB_OUTPUT"
          else
            for extra in README.md README LICENSE LICENSE-MIT LICENSE-APACHE COPYING; do
              if [ -f "$extra" ]; then cp "$extra" dist/pkg/; fi
            done
            tar czf "dist/${PROJECT}.tar.gz" -C dist pkg
            names="${PROJECT}.tar.gz"
            echo "mode=tarball" >> "$GITHUB_OUTPUT"
          fi
          echo "files=${names# }" >> "$GITHUB_OUTPUT"

          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ steps.params.outputs.project }}-${{ steps.params.outputs.profile }}
          path: src/dist
          if-no-files-found: error
          retention-days: 14

      - name: Delete source gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Nothing to clean up."
            exit 0
          fi
          if GH_TOKEN="$GIST_TOKEN" gh api -X DELETE "gists/$GIST_ID" 2>/dev/null; then
            echo "Deleted source gist $GIST_ID"
          else
            echo "::warning::Could not delete gist $GIST_ID. Remove it manually."
          fi

      - name: Summary
        if: always()
        env:
          PROJECT: ${{ steps.params.outputs.project }}
          PROFILE: ${{ steps.params.outputs.profile }}
          MODE: ${{ steps.pack.outputs.mode }}
          FILES: ${{ steps.pack.outputs.files }}
        run: |
          {
            echo "### fbt rust build"
            echo "- project: \`$PROJECT\`"
            echo "- profile: \`$PROFILE\`"
            echo "- packaging: \`$MODE\`"
            echo "- files: \`$FILES\`"
          } >> "$GITHUB_STEP_SUMMARY"