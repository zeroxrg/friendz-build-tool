name: dotnet

on:
  repository_dispatch:
    types: [dotnet]
  workflow_call:
    inputs:
      gist_id:
        description: 'ID of the secret gist holding src.tar.gz.b64'
        required: true
        type: string
      project:
        description: 'Project name, used for artifact naming'
        required: false
        type: string
        default: 'app'
      configuration:
        description: 'Release or Debug'
        required: false
        type: string
        default: 'Release'
      runtime:
        description: 'Runtime identifier, e.g. linux-x64. Empty means host default.'
        required: false
        type: string
        default: ''
      run_tests:
        description: 'Run dotnet test before publishing'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.event.client_payload.gist_id || inputs.gist_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve inputs
        id: params
        env:
          EV_GIST: ${{ github.event.client_payload.gist_id }}
          EV_PROJECT: ${{ github.event.client_payload.project }}
          EV_CONFIG: ${{ github.event.client_payload.configuration }}
          EV_RUNTIME: ${{ github.event.client_payload.runtime }}
          EV_TESTS: ${{ github.event.client_payload.run_tests }}
          IN_GIST: ${{ inputs.gist_id }}
          IN_PROJECT: ${{ inputs.project }}
          IN_CONFIG: ${{ inputs.configuration }}
          IN_RUNTIME: ${{ inputs.runtime }}
          IN_TESTS: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail
          pick() {
            if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi
          }
          {
            echo "gist=$(pick "$EV_GIST" "$IN_GIST")"
            echo "project=$(pick "$EV_PROJECT" "$IN_PROJECT")"
            echo "config=$(pick "$EV_CONFIG" "$IN_CONFIG")"
            echo "runtime=$(pick "$EV_RUNTIME" "$IN_RUNTIME")"
            echo "tests=$(pick "$EV_TESTS" "$IN_TESTS")"
          } >> "$GITHUB_OUTPUT"
          echo "project=${{ steps.params.outputs.project }} config=${{ steps.params.outputs.config }} runtime=${{ steps.params.outputs.runtime }} tests=${{ steps.params.outputs.tests }}"

      - name: Validate inputs
        env:
          CONFIG: ${{ steps.params.outputs.config }}
          RUNTIME: ${{ steps.params.outputs.runtime }}
          TESTS: ${{ steps.params.outputs.tests }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            Release|Debug) ;;
            *) echo "::error::configuration must be Release or Debug, got '$CONFIG'"; exit 1 ;;
          esac
          if [ -n "$RUNTIME" ] && ! printf '%s' "$RUNTIME" | grep -Eq '^[a-z]+-[a-z0-9]+$'; then
            echo "::error::invalid runtime identifier: '$RUNTIME'"
            exit 1
          fi
          case "$TESTS" in
            true|false) ;;
            *) echo "::error::tests must be true or false, got '$TESTS'"; exit 1 ;;
          esac
          echo "inputs ok"

      - name: Fetch source from secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          set -euo pipefail
          if [ -z "$GIST_TOKEN" ]; then
            echo "::error::GIST_TOKEN secret is not set on this repository."
            exit 1
          fi
          if [ -z "$GIST_ID" ]; then
            echo "::error::No gist id supplied."
            exit 1
          fi
          url=$(GH_TOKEN="$GIST_TOKEN" gh api "gists/$GIST_ID" \
            --jq '.files["src.tar.gz.b64"].raw_url // .files["src.tar.gz"].raw_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Gist $GIST_ID has no src.tar.gz.b64 file."
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GIST_TOKEN" "$url" -o src.b64
          base64 -d src.b64 > src.tar.gz
          rm -f src.b64
          ls -l src.tar.gz

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p src
          tar xzf src.tar.gz -C src
          rm -f src.tar.gz
          ls -A src

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Locate solution or project
        id: dotnet
        working-directory: src
        run: |
          set -euo pipefail
          target=""
          for f in *.sln; do
            [ -e "$f" ] && { target="$f"; break; }
          done
          if [ -z "$target" ]; then
            for f in *.csproj; do
              [ -e "$f" ] && { target="$f"; break; }
            done
          fi
          if [ -z "$target" ]; then
            target="$(find . -maxdepth 2 \( -name '*.sln' -o -name '*.csproj' \) -type f | sort | head -1)"
            target="${target#./}"
          fi
          if [ -z "$target" ]; then
            echo "::error::No .sln or .csproj found in the uploaded source."
            exit 1
          fi
          root="$(dirname "$target")"
          hash="$(find "$root" -name '*.csproj' -o -name 'global.json' -o -name 'Directory.Packages.props' \
            | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -c1-16)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "target: $target"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: dotnet-${{ steps.params.outputs.project }}-${{ steps.dotnet.outputs.hash }}
          restore-keys: |
            dotnet-${{ steps.params.outputs.project }}-
            dotnet-

      - name: Run tests
        if: steps.params.outputs.tests == 'true'
        working-directory: src
        env:
          ROOT: ${{ steps.dotnet.outputs.root }}
          TARGET: ${{ steps.dotnet.outputs.target }}
          CONFIG: ${{ steps.params.outputs.config }}
        run: |
          set -euo pipefail
          cd "$ROOT"
          dotnet test "$(basename "$TARGET")" -c "$CONFIG"

      - name: Publish
        id: publish
        working-directory: src
        env:
          ROOT: ${{ steps.dotnet.outputs.root }}
          TARGET: ${{ steps.dotnet.outputs.target }}
          CONFIG: ${{ steps.params.outputs.config }}
          RUNTIME: ${{ steps.params.outputs.runtime }}
          PROJECT: ${{ steps.params.outputs.project }}
        run: |
          set -euo pipefail
          cd "$ROOT"

          dist="$GITHUB_WORKSPACE/src/dist"
          mkdir -p "$dist/pub"

          args=(-c "$CONFIG" -o "$dist/pub")
          [ -n "$RUNTIME" ] && args+=(-r "$RUNTIME")

          echo "dotnet publish $(basename "$TARGET") ${args[*]}"
          dotnet publish "$(basename "$TARGET")" "${args[@]}"

          if [ -z "$(ls -A "$dist/pub")" ]; then
            echo "::error::Publish produced no output."
            exit 1
          fi

          tarball="$PROJECT-$CONFIG${RUNTIME:+-$RUNTIME}.tar.gz"
          tar czf "$dist/$tarball" -C "$dist/pub" .
          rm -rf "$dist/pub"

          echo "files=$tarball" >> "$GITHUB_OUTPUT"
          ls -l "$dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-${{ steps.params.outputs.project }}-${{ steps.params.outputs.config }}-${{ steps.params.outputs.runtime || 'host' }}
          path: src/dist
          if-no-files-found: error
          retention-days: 14

      - name: Delete source gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Nothing to clean up."
            exit 0
          fi
          if GH_TOKEN="$GIST_TOKEN" gh api -X DELETE "gists/$GIST_ID" 2>/dev/null; then
            echo "Deleted source gist $GIST_ID"
          else
            echo "::warning::Could not delete gist $GIST_ID. Remove it manually."
          fi

      - name: Summary
        if: always()
        env:
          PROJECT: ${{ steps.params.outputs.project }}
          CONFIG: ${{ steps.params.outputs.config }}
          RUNTIME: ${{ steps.params.outputs.runtime }}
          FILES: ${{ steps.publish.outputs.files }}
        run: |
          {
            echo "### fbt dotnet build"
            echo "- project: \`$PROJECT\`"
            echo "- configuration: \`$CONFIG\`"
            echo "- runtime: \`${RUNTIME:-host}\`"
            echo "- files: \`${FILES:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
