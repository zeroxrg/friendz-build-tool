name: android

on:
  repository_dispatch:
    types: [build]
  workflow_call:
    inputs:
      gist_id:
        description: 'ID of the secret gist holding src.tar.gz'
        required: true
        type: string
      project:
        description: 'Project name, used for artifact naming'
        required: false
        type: string
        default: 'App'
      variant:
        description: 'Gradle build variant'
        required: false
        type: string
        default: 'debug'
      signed:
        description: 'Sign the APK with the tool repo release key'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.client_payload.gist_id || inputs.gist_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve inputs
        id: params
        env:
          EV_GIST: ${{ github.event.client_payload.gist_id }}
          EV_PROJECT: ${{ github.event.client_payload.project }}
          EV_VARIANT: ${{ github.event.client_payload.variant }}
          EV_SIGNED: ${{ github.event.client_payload.signed }}
          IN_GIST: ${{ inputs.gist_id }}
          IN_PROJECT: ${{ inputs.project }}
          IN_VARIANT: ${{ inputs.variant }}
          IN_SIGNED: ${{ inputs.signed }}
        run: |
          set -euo pipefail
          pick() {
            if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi
          }
          {
            echo "gist=$(pick "$EV_GIST" "$IN_GIST")"
            echo "project=$(pick "$EV_PROJECT" "$IN_PROJECT")"
            echo "variant=$(pick "$EV_VARIANT" "$IN_VARIANT")"
            echo "signed=$(pick "$EV_SIGNED" "$IN_SIGNED")"
          } >> "$GITHUB_OUTPUT"
          echo "project=${{ steps.params.outputs.project }} variant=${{ steps.params.outputs.variant }} signed=${{ steps.params.outputs.signed }}"

      - name: Validate inputs
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
          SIGNED: ${{ steps.params.outputs.signed }}
        run: |
          set -euo pipefail
          # The variant becomes a Gradle task name, so it is held to what a task
          # name can actually be rather than passed through.
          if ! printf '%s' "$VARIANT" | grep -Eq '^[A-Za-z][A-Za-z0-9]*$'; then
            echo "::error::invalid variant: '$VARIANT'"
            exit 1
          fi
          case "$SIGNED" in
            true|false) ;;
            *) echo "::error::signed must be true or false, got '$SIGNED'"; exit 1 ;;
          esac
          echo "inputs ok"

      - name: Fetch source from secret gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          set -euo pipefail
          if [ -z "$GIST_TOKEN" ]; then
            echo "::error::GIST_TOKEN secret is not set on this repository."
            exit 1
          fi
          if [ -z "$GIST_ID" ]; then
            echo "::error::No gist id supplied."
            exit 1
          fi
          # Accept either name so a hand-made test gist works too.
          url=$(GH_TOKEN="$GIST_TOKEN" gh api "gists/$GIST_ID" \
            --jq '.files["src.tar.gz.b64"].raw_url // .files["src.tar.gz"].raw_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Gist $GIST_ID has no src.tar.gz.b64 file."
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GIST_TOKEN" "$url" -o src.b64
          base64 -d src.b64 > src.tar.gz
          rm -f src.b64
          ls -l src.tar.gz

      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p src
          tar xzf src.tar.gz -C src
          rm -f src.tar.gz
          ls -A src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # After the JDK step: reading the certificate back out of the keystore
      # needs keytool, and the fingerprint it yields is what the finished APK is
      # checked against.
      - name: Stage release signing key
        id: signing
        if: steps.params.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for v in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::signing requested but these secrets are not set on this repository:$missing"
            echo "::error::run 'fbt key push' to upload a release key."
            exit 1
          fi

          dir="$RUNNER_TEMP/fbt-signing"
          umask 077
          mkdir -p "$dir"
          ks="$dir/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"

          fp="$(keytool -list -v -keystore "$ks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" 2>/dev/null \
                | awk '/SHA256:/ { l=$0; sub(/.*SHA256:[[:space:]]*/, "", l); gsub(/[:[:space:]]/, "", l); print tolower(l); exit }')"
          if [ -z "$fp" ]; then
            echo "::error::could not read alias '$KEY_ALIAS' from the release keystore."
            exit 1
          fi

          # Written as Gradle properties rather than -P flags so the passwords
          # never sit in the runner's process table for the length of the build.
          gp="$HOME/.gradle/gradle.properties"
          mkdir -p "$HOME/.gradle"
          touch "$gp"
          # Backslash is the only escape Java properties gives us, and a
          # password containing one would otherwise be read back as truncated.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo '# >>> fbt signing >>>'
            # AGP honours these whatever the project's build file says, which is
            # what makes this work for a project with no signingConfigs block.
            echo "android.injected.signing.store.file=$ks"
            echo "android.injected.signing.store.password=$(esc "$STORE_PASS")"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$(esc "$KEY_PASS")"
            # The same values under the names a project's own signingConfigs
            # block conventionally reads. An explicit signingConfig wins over
            # the injected ones, so a project that already has one still signs
            # correctly.
            echo "RELEASE_STORE_FILE=$ks"
            echo "RELEASE_STORE_PASSWORD=$(esc "$STORE_PASS")"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$(esc "$KEY_PASS")"
            echo '# <<< fbt signing <<<'
          } >> "$gp"

          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "staged release key, alias '$KEY_ALIAS', cert SHA-256 $fp"

      - name: Build APK
        working-directory: src
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          # Prefer the project's wrapper when one exists, otherwise fall back to
          # the Gradle installed by setup-gradle. Several projects on this
          # account have no wrapper committed.
          if [ -x ./gradlew ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi
          cap="$(printf '%s' "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          task="assemble${cap}"
          echo "Running: $GRADLE $task"
          "$GRADLE" --no-daemon --stacktrace "$task"

      - name: Locate APK
        id: apk
        working-directory: src
        env:
          VARIANT: ${{ steps.params.outputs.variant }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t apks < <(find . -name '*.apk' -type f -not -path './.gradle/*')
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::Build succeeded but produced no APK."
            exit 1
          fi
          printf 'Found %d APK(s)\n' "${#apks[@]}"
          best=""
          for a in "${apks[@]}"; do
            if [[ "$a" == *"$VARIANT"* ]]; then best="$a"; fi
          done
          if [ -z "$best" ]; then best="${apks[0]}"; fi
          cp "$best" out.apk
          echo "picked=$best" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s out.apk)" >> "$GITHUB_OUTPUT"

      # A release build that silently comes out unsigned, or signed with the
      # debug key because the project has no signingConfigs block, is the exact
      # failure this catches. AGP falls back to debug signing rather than
      # erroring, so nothing upstream complains.
      - name: Verify release signature
        id: verify
        if: steps.params.outputs.signed == 'true'
        working-directory: src
        env:
          EXPECTED: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          shopt -s nullglob
          signers=("$sdk"/build-tools/*/apksigner)
          if [ ${#signers[@]} -eq 0 ]; then
            echo "::warning::no apksigner under $sdk/build-tools, skipping verification"
            exit 0
          fi
          signer="$(printf '%s\n' "${signers[@]}" | sort -V | tail -1)"
          echo "verifying with $signer"

          if ! "$signer" verify --verbose --print-certs out.apk; then
            echo "::error::out.apk is not signed. A release build must not produce an unsigned APK."
            exit 1
          fi

          # Matched on the digest field alone, not the label. apksigner prefixes
          # the line with the scheme that verified it ("V2 Signer:", "Signer #1"),
          # which varies by build-tools version and by which schemes are present,
          # so pinning the label breaks whenever either changes.
          # Filtered to bare hex so only a real digest line can match, whatever
          # else might be on stdout.
          mapfile -t digests < <("$signer" verify --print-certs out.apk \
            | awk '/certificate SHA-256 digest:/ {print tolower($NF)}' \
            | grep -E '^[0-9a-f]{64}$' | sort -u)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::error::could not read a signer certificate out of out.apk"
            exit 1
          fi
          # sort -u leaves one entry only when every signer is the same key, so a
          # second, unexpected signer cannot slip past on the first match.
          if [ ${#digests[@]} -ne 1 ] || [ "${digests[0]}" != "$EXPECTED" ]; then
            echo "::error::signed with the wrong key"
            echo "::error::expected $EXPECTED"
            echo "::error::got      ${digests[*]}"
            echo "::error::a project with no release signingConfig is signed by AGP with the debug key."
            exit 1
          fi
          actual="${digests[0]}"
          echo "signer cert SHA-256: $actual"

          echo "certificate=$actual" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.params.outputs.project }}-${{ steps.params.outputs.variant }}
          path: src/out.apk
          if-no-files-found: error
          retention-days: 14

      # Both the keystore and the properties block that references it go, on
      # failure and cancellation as well as success. The runner is discarded
      # afterwards regardless, but a job that continues into a later step
      # should not find either one still readable.
      - name: Destroy signing material
        if: always()
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/fbt-signing"
          if [ -d "$dir" ]; then
            find "$dir" -type f -exec shred -u {} + 2>/dev/null \
              || find "$dir" -type f -delete 2>/dev/null \
              || true
            rm -rf "$dir"
            echo "removed the release keystore from the runner"
          fi
          gp="$HOME/.gradle/gradle.properties"
          if [ -f "$gp" ]; then
            sed -i '/# >>> fbt signing >>>/,/# <<< fbt signing <<</d' "$gp"
            echo "removed signing properties from gradle.properties"
          fi

      - name: Delete source gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ steps.params.outputs.gist }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Nothing to clean up."
            exit 0
          fi
          if GH_TOKEN="$GIST_TOKEN" gh api -X DELETE "gists/$GIST_ID" 2>/dev/null; then
            echo "Deleted source gist $GIST_ID"
          else
            echo "::warning::Could not delete gist $GIST_ID. Remove it manually."
          fi

      - name: Summary
        if: always()
        env:
          PROJECT: ${{ steps.params.outputs.project }}
          VARIANT: ${{ steps.params.outputs.variant }}
          SIGNED: ${{ steps.params.outputs.signed }}
          PICKED: ${{ steps.apk.outputs.picked }}
          BYTES: ${{ steps.apk.outputs.bytes }}
          CERT: ${{ steps.verify.outputs.certificate }}
        run: |
          {
            echo "### fbt build"
            echo "- project: \`$PROJECT\`"
            echo "- variant: \`$VARIANT\`"
            echo "- signed: \`$SIGNED\`"
            [ -n "$CERT" ] && echo "- signing cert SHA-256: \`$CERT\`"
            echo "- apk: \`$PICKED\` (${BYTES:-0} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"